name: Release artifacts

# Attach a wheel, an sdist and their SHA-256 checksums to every published
# release, and — once PyPI trusted publishing is configured — upload the same
# artifacts to PyPI.
#
# The attach job always runs, so a release is installable without PyPI:
#     pip install https://github.com/mikhaeelatefrizk/bindsight/releases/download/<tag>/bindsight-<version>-py3-none-any.whl
#
# The PyPI job is dormant until the project is registered as a trusted publisher
# (pypi.org → project → Publishing → add GitHub as a publisher with this
# repository, workflow `release-artifacts.yml` and environment `pypi`). It uses
# OIDC, so no API token is ever stored in this repository. Until the
# `pypi` environment exists the job is skipped rather than failing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build twine
      - run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Checksum
        working-directory: dist
        run: sha256sum bindsight-*.whl bindsight-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  attach:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Drop the checksum file
        # SHA256SUMS is a release asset, not a distribution; twine rejects it.
        run: rm -f dist/SHA256SUMS
      # Pinned by commit, like the JOSS action in draft-pdf.yml, whose comment
      # argues a floating ref is unacceptable for something that builds a
      # submission. The argument is stronger here: `release/v1` is a *branch*,
      # so this step -- the one holding the credential that publishes to PyPI
      # -- ran whatever had most recently been pushed to it. A tag is at least
      # a statement of intent; a branch is not.
      #
      # This SHA is what `release/v1` points at today and what the `v1.14.2`
      # tag dereferences to, so pinning changes nothing now. The job is dormant
      # until `vars.PYPI_TRUSTED_PUBLISHING` is set, which makes now the
      # cheapest possible moment.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
