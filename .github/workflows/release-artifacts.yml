name: Release artifacts

# Attach a wheel, an sdist and their SHA-256 checksums to every published
# release, and upload the same two files to PyPI.
#
# The attach job always runs, so a release is installable without PyPI:
#     pip install https://github.com/mikhaeelatefrizk/bindsight/releases/download/<tag>/bindsight-<version>-py3-none-any.whl
#
# The PyPI job runs when the `PYPI_TRUSTED_PUBLISHING` repository variable is
# `true` and the `pypi` environment exists -- both since 0.3.5, the first
# release published there. The project is registered on PyPI as a trusted
# publisher of this repository, workflow `release-artifacts.yml`, environment
# `pypi`, so the upload is authorised by OIDC and no API token is ever stored
# in this repository. Without the variable the job is skipped, not failed.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build twine
      - name: Point the README's relative links at this tag for PyPI
        # PyPI renders the long description with no base URL, so every
        # relative link in README.md is dead there. The checkout is rewritten
        # (never committed) so the sdist and wheel carry absolute links.
        run: python scripts/pypi_readme.py --write --ref "${{ github.event.release.tag_name || github.ref_name }}"
      - run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Checksum
        working-directory: dist
        run: sha256sum bindsight-*.whl bindsight-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  attach:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Drop the checksum file
        # SHA256SUMS is a release asset, not a distribution; twine rejects it.
        run: rm -f dist/SHA256SUMS
      # Pinned by commit, like the JOSS action in draft-pdf.yml, whose comment
      # argues a floating ref is unacceptable for something that builds a
      # submission. The argument is stronger here: `release/v1` is a *branch*,
      # so this step -- the one holding the credential that publishes to PyPI
      # -- ran whatever had most recently been pushed to it. A tag is at least
      # a statement of intent; a branch is not.
      #
      # This SHA is what `release/v1` points at today and what the `v1.14.2`
      # tag dereferences to, so pinning changed nothing at the time. The job
      # was dormant until `vars.PYPI_TRUSTED_PUBLISHING` was set for 0.3.5,
      # which made that the cheapest possible moment.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
