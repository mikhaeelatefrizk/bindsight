name: Docker

# Build the CPU image on every PR (verifies the Dockerfile), and build + push
# to GHCR on pushes to main / tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && vars.PUBLISH_GHCR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v7
        with:
          context: .
          # Publishing is opt-in. It needs two account-level settings that
          # `permissions:` cannot grant: the ghcr.io package must list this
          # repository under Manage Actions access with role Write (the
          # package predates the current repository object -- the repository
          # was recreated on 2026-09-14 -- and nothing re-links them on its
          # own), and the repository variable PUBLISH_GHCR must be `true`.
          # Until both were done, every push-to-main run failed on
          # `denied: permission_denied: write_package` and none on the build,
          # so a red X reported a settings problem as a code problem on every
          # commit -- which is how a check stops being read at all. The build
          # below runs either way, so a broken Dockerfile still fails here.
          #
          # Both are in place as of 0.3.1. The `org.opencontainers.image.source`
          # label in the Dockerfile keeps the package connected to this
          # repository object from here on.
          push: ${{ github.event_name != 'pull_request' && vars.PUBLISH_GHCR == 'true' }}
          # A version tag on tag pushes. The workflow triggers on `v*` and
          # published only `:latest` and `:<sha>`, so a release produced no
          # tag anyone could pin to — and `:latest` moved under them instead.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', env.IMAGE, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Say so when the image was built but not published
        if: github.event_name != 'pull_request' && vars.PUBLISH_GHCR != 'true'
        run: |
          echo "::notice title=Image built, not published::The image built successfully and was NOT pushed to ghcr.io: the repository variable PUBLISH_GHCR is not 'true'. Publishing also needs the package to list this repository under Manage Actions access with role Write."

