name: Keep demo warm

# The bindsight live demo runs on a free-tier Hugging Face Space that sleeps
# after ~48 h of no traffic. Once asleep, the next visitor sees a wake-up
# screen and waits 60-120 s for the container to rebuild — a bad first
# impression for first-time visitors.
#
# This workflow pings the Space every 6 h, but more importantly it CHECKS
# the actual run-time stage via the platform's status API, rather than
# relying on a 200 from the sleep page (which is what naïve curl-based
# pingers do, including this workflow's own previous iteration).
#
# If the Space is found in a non-running stage, the workflow attempts a
# wake-up GET with a long timeout, then re-checks.  Persistent failure
# surfaces as an annotation in the Actions tab.

on:
  schedule:
    # Every 6 hours.  GitHub Actions for public repos costs $0, and a
    # 6-hourly ping sits ~8x under HF's free-tier 48 h sleep threshold —
    # ample margin against GitHub's occasional schedule skips during peak
    # times (see github.com/orgs/community/discussions/53658).
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/keep-warm.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  hf-space:
    name: HF Space
    runs-on: ubuntu-latest
    # Keepalive + monitor: a transient curl/network/API blip must never fail
    # the run and email. A genuine outage still surfaces as a ::warning::/
    # ::error:: annotation in the Actions tab (pull, not push). For real push
    # outage alerts, use a free external uptime monitor (UptimeRobot /
    # BetterStack / Cronitor) on the same URLs instead of a failing cron.
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Check stage + warm if asleep
        env:
          SPACE: Mikhaeelatefrizk/bindsight
          APP_URL: https://mikhaeelatefrizk-bindsight.hf.space
          UI_URL: https://huggingface.co/spaces/Mikhaeelatefrizk/bindsight
        run: |
          set -euo pipefail

          # Hugging Face exposes per-Space runtime state at
          # https://huggingface.co/api/spaces/<user>/<name>.  The
          # `runtime.stage` field is RUNNING / SLEEPING / BUILDING /
          # STOPPED / RUNTIME_ERROR / etc.
          api_stage() {
            curl -sSL --max-time 30 \
              "https://huggingface.co/api/spaces/${SPACE}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('runtime',{}).get('stage','UNKNOWN'))"
          }

          stage="$(api_stage)"
          echo "Initial stage: ${stage}"
          echo "::notice title=HF stage::${stage}"

          # SLEEPING is the routine case: visiting the UI URL kicks off
          # the wake-up. Hit the UI URL once with a long timeout, then probe
          # the interface's own overview at `/`. It used to probe
          # `/_stcore/health`, which was Streamlit's and which nothing serves
          # now -- so the check that exists to prove the Space is up would
          # have failed every run for a reason unrelated to the Space.
          if [ "${stage}" = "SLEEPING" ] || [ "${stage}" = "STOPPED" ]; then
            echo "Triggering wake by visiting the UI URL..."
            curl -sSL --max-time 240 --retry 2 --retry-delay 30 \
                 --max-redirs 100 \
                 -A 'bindsight-keep-warm/2 (+https://github.com/mikhaeelatefrizk/bindsight)' \
                 -o /dev/null -w "wake-visit HTTP %{http_code} in %{time_total}s\n" \
                 "${UI_URL}" || true

            # Poll the API for up to 4 min for RUNNING + READY domain.
            for i in $(seq 1 16); do
              sleep 15
              stage="$(api_stage)"
              echo "poll ${i}: stage=${stage}"
              if [ "${stage}" = "RUNNING" ]; then break; fi
            done
          fi

          if [ "${stage}" != "RUNNING" ]; then
            echo "::error title=HF Space stuck::Stage is '${stage}', expected RUNNING."
            exit 1
          fi

          # Final health probe. This asked for /_stcore/health, which was
          # Streamlit's; nothing serves it now, so the check that exists to
          # prove the Space is up would have failed on every run for a
          # reason that has nothing to do with the Space. The interface
          # serves its overview at /, so that is what is probed.
          code=$(curl -sSL --max-time 60 --retry 3 --retry-delay 10 \
                      -o /dev/null -w "%{http_code}" \
                      -A 'bindsight-keep-warm/2' \
                      "${APP_URL}/")
          echo "GET / -> ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error title=HF health unhealthy::GET / returned ${code}"
            exit 1
          fi

          # A 200 from / says something answered, not that it is this software.
          # The Space spent this release serving the Streamlit app that was
          # removed -- an empty page titled "Streamlit" -- which answers 200
          # just as well, so this check reported a healthy demo for an
          # application that is not bindsight. `docs/index.md` links that Space
          # as "Try it live".
          #
          # `/static/bindsight.css` is published only by the served interface,
          # and `--ink-faint` is a token inside it, so a 200 carrying that
          # string means the running Space is this interface and not something
          # else that happens to be up.
          css=$(curl -sSL --max-time 60 --retry 3 --retry-delay 10 \
                     -A 'bindsight-keep-warm/2' \
                     "${APP_URL}/static/bindsight.css" || true)
          if ! printf '%s' "${css}" | grep -q -- '--ink-faint'; then
            echo "::error title=HF demo is not this interface::GET /static/bindsight.css did not return the interface stylesheet. The Space is running, but it is not serving this build -- most likely it never received one, because sync-hf-space.yml is dormant until an HF_TOKEN secret exists and skips every step (reporting success) without it."
            exit 1
          fi
          echo "::notice title=HF demo healthy::stage=RUNNING, health=200, serving the current interface"

