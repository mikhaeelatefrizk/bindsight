name: Manuscript PDF

# The methods manuscript is LaTeX and the machine it is written on has no TeX
# distribution, so CI typesets it. Every push that touches the manuscript or
# the shared bibliography leaves a `methods-manuscript` artifact on the run,
# and every published release carries the same PDF as an asset named for the
# tag. `paper/README.md` sends a submitter to one of those two places.
#
# Overleaf is not the fallback it looks like. `manuscript.tex` reaches its
# bibliography with \addbibresource{../paper.bib} -- one directory up, shared
# with the JOSS paper so a citation is fixed in one place. Zipping
# `paper/methods/` alone uploads a project with no bibliography, which still
# compiles and hands back a PDF with a question mark where every citation
# should be. The action below runs in the full checkout, so the relative path
# resolves, and latexmk runs biber by itself when it sees the .bcf that
# biblatex writes. A step after the build fails the run on any citation that
# stayed undefined, so that failure cannot render.

on:
  push:
    paths:
      - 'paper/methods/**'
      - 'paper/validation/**'
      - 'paper/paper.bib'
      - '.github/workflows/manuscript-pdf.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Typeset the methods manuscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile manuscript.tex with latexmk
        # Pinned to the commit the `v4` tag points at (release 4.1.0), like
        # every other third-party action here; tests/test_packaging_pins.py
        # refuses a branch or a moving ref.
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b  # v4 (4.1.0)
        with:
          working_directory: paper/methods
          root_file: manuscript.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Fail on undefined citations or references
        # A missing bibliography does not stop latexmk; it leaves "[?]" where
        # every citation should be and a warning in the log. Stop here instead.
        run: |
          if grep -E "Citation .* undefined|Reference .* undefined|There were undefined" paper/methods/manuscript.log; then
            echo "::error::the typeset manuscript has undefined citations or references"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: methods-manuscript
          path: paper/methods/manuscript.pdf
          if-no-files-found: error

  study:
    name: Typeset the validation study
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pandoc and a PDF engine
        # apt rather than a third-party action: no new pinning question, and
        # tests/test_packaging_pins.py allows actions/* at a version tag only.
        #
        # lmodern is named explicitly because pandoc's default LaTeX template
        # loads it and none of the texlive-* metapackages pull it in: the first
        # run of this job died on a missing lmodern.sty. The study also needs
        # xelatex rather than pdflatex -- it contains a superscript minus
        # (U+207B), which inputenc cannot represent.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended \
            lmodern fonts-dejavu-core
      - name: Render manuscript.md
        # The study is Markdown with a hand-numbered reference list and no
        # embedded images, so there is nothing to resolve outside the file.
        #
        # mainfont is not cosmetic. Latin Modern has no glyph for U+2265 or
        # U+207B, and xelatex prints nothing where a glyph is missing, so the
        # first green build of this job dropped both: the Methods sentence
        # "|log2fc| >= 1" lost its operator, and the adjusted p-value
        # "5.6 x 10^-11" lost the minus from its exponent, in both places it
        # appears. DejaVu Serif has both glyphs. The check below is the part
        # that matters -- a font can change again, silence cannot be allowed to.
        run: |
          # pipefail because the pipe into tee below would otherwise report
          # tee's exit code and hide a failed render completely.
          set -o pipefail
          cd paper/validation
          pandoc manuscript.md \
            --from=gfm \
            --output=manuscript.pdf \
            --pdf-engine=xelatex \
            --variable=mainfont:'DejaVu Serif' \
            --variable=monofont:'DejaVu Sans Mono' \
            --variable=geometry:margin=1in \
            --variable=fontsize:11pt \
            --standalone 2>&1 | tee pandoc.log
      - name: Fail on any character the font could not print
        # pandoc warns and exits 0. A size floor cannot see this and neither
        # can a reader: the number just reads differently. Same reasoning as
        # the undefined-citation check in the job above.
        run: |
          if grep -F 'Missing character' paper/validation/pandoc.log; then
            echo "::error::the study PDF is missing glyphs; characters above were dropped silently"
            exit 1
          fi
      - name: Fail if the PDF came back empty
        # pandoc exits 0 on a document it rendered as one blank page. The study
        # is ~2,800 words, so anything under 40 kB is a build that silently
        # produced nothing -- the failure mode this whole file is arranged
        # against.
        run: |
          size=$(stat -c%s paper/validation/manuscript.pdf)
          echo "manuscript.pdf is ${size} bytes"
          if [ "$size" -lt 40000 ]; then
            echo "::error::the study PDF is ${size} bytes; it did not render"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: study-manuscript
          path: paper/validation/manuscript.pdf
          if-no-files-found: error

  attach:
    name: Attach to the release
    needs: [build, study]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: methods-manuscript
          path: paper/methods
      - uses: actions/download-artifact@v8
        with:
          name: study-manuscript
          path: paper/validation
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # Renamed so each asset says which document it is next to the wheel,
        # the sdist and the JOSS paper's PDF. Three PDFs now travel with a
        # release and they are all `manuscript.pdf` or `paper.pdf` in the tree,
        # so the release-page name is the only thing telling them apart.
        run: |
          cp paper/methods/manuscript.pdf "bindsight-${TAG}-methods-manuscript.pdf"
          cp paper/validation/manuscript.pdf "bindsight-${TAG}-validation-study.pdf"
          gh release upload "$TAG" \
            "bindsight-${TAG}-methods-manuscript.pdf" \
            "bindsight-${TAG}-validation-study.pdf" \
            --clobber --repo "${{ github.repository }}"
