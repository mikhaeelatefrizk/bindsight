name: Docs

# Build the mkdocs-material site and publish it to GitHub Pages.
# Enable once in repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      # docs/results.md is generated from the committed benchmark results, so a
      # new benchmark run must republish the site.
      - "benchmarks/**"
      - "bindsight/report/showcase.py"
      - "scripts/build_docs_results.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      # pandas is not a core dependency, but importing bindsight.report runs
      # its __init__, which pulls in report/html.py -> pandas. Cheaper than
      # installing the whole [discover] extra (pydeseq2, pyarrow, biopython…)
      # for what is only a Markdown generation step.
      - name: Install docs deps
        run: pip install -e "." "pandas>=2.2" "mkdocs-material>=9.5,<10"
      - name: Regenerate the results page from benchmarks/
        run: python scripts/build_docs_results.py
      # --strict fails the build on broken internal links. It caught nine
      # already-live 404s the first time it was switched on.
      - name: Build site
        run: mkdocs build --strict --site-dir site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
