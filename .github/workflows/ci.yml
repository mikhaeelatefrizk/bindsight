name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discover,report]"
      - name: Ruff check
        run: ruff check bindsight tests scripts
      - name: Ruff format
        run: ruff format --check bindsight tests scripts
      # Blocking. pyproject sets strict = true and CI swallowed the result with
      # `|| true`, so 53 errors accumulated unnoticed -- including the arity bug
      # that left the Snakemake front-end dead for five weeks.
      - name: mypy
        run: mypy bindsight

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discover,report]"
      # The Snakemake front-end is now exercised in CI. It runs offline via
      # BINDSIGHT_CACHE_DIR and adds ~15 s. Linux only: Snakemake's Windows
      # support is unreliable, and the test skips itself elsewhere, so this
      # keeps the signal trustworthy rather than flaky.
      - name: Install the workflow extra (Linux only)
        if: runner.os == 'Linux'
        run: pip install -e ".[workflow]"
      # Coverage is configured in pyproject and was disabled here by --no-cov,
      # so it had never actually run.
      - name: Pytest (no GPU, no slow)
        run: pytest -m "not gpu and not slow" --maxfail=5 -q

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
