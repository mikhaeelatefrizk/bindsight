name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discover,report]"
      - name: Ruff check
        run: ruff check bindsight tests scripts benchmarks
      - name: Ruff format
        run: ruff format --check bindsight tests scripts benchmarks
      # Blocking. pyproject sets strict = true and CI swallowed the result with
      # `|| true`, so 53 errors accumulated unnoticed -- including the arity bug
      # that left the Snakemake front-end dead for five weeks. That front-end is
      # scripts/, which this step did not check: the justification named a
      # directory outside its own scope.
      - name: mypy
        run: mypy bindsight scripts benchmarks

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.13 is here because pyproject's classifiers claim it. An interpreter
        # the project claims and does not test is an untested claim.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,discover,report]"
      # The Snakemake front-end is now exercised in CI. It runs offline via
      # BINDSIGHT_CACHE_DIR and adds ~15 s. Linux only: Snakemake's Windows
      # support is unreliable, and the test skips itself elsewhere, so this
      # keeps the signal trustworthy rather than flaky.
      - name: Install the workflow extra (Linux only)
        if: runner.os == 'Linux'
        run: pip install -e ".[workflow]"
      # Coverage is configured in pyproject and was disabled here by --no-cov,
      # so it had never actually run. It now runs AND gates: --cov-fail-under
      # fails the build if coverage regresses below the floor. Kept a couple of
      # points under the ~77% baseline so ordinary churn doesn't flake, while a
      # real drop (e.g. a whole module left untested) still trips it.
      - name: Pytest (no GPU, no slow)
        run: pytest -m "not gpu and not slow" --maxfail=5 -q --cov-fail-under=75

  # `envs/constraints.txt` calls itself "the exact versions this release was
  # resolved and tested against". Only the Dockerfile ever applied it; the
  # matrix above installs unpinned, so the pins governed the container and
  # nothing else. That is why a Dependabot PR widening a pyproject range was the
  # only one of four that changed what CI resolved — the others edited a file no
  # job read.
  #
  # The matrix stays unpinned on purpose: it proves the code works across three
  # Pythons and three platforms. This job proves the *recorded* environment
  # still resolves and still produces the committed artifacts, which is the
  # claim the file actually makes.
  pinned:
    name: Pinned environment (constraints.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install exactly what the release records
        run: |
          python -m pip install --upgrade pip
          pip install -c envs/constraints.txt -e ".[dev,discover,report]"
      - name: The installed versions are the recorded ones
        run: python scripts/check_pinned_environment.py
      - name: Regenerating the published pages changes nothing
        run: |
          python scripts/build_docs_results.py
          # Every output the generator writes, assets included. It copies
          # figures, the twenty predicted complexes, the vendored viewer and its
          # licence into docs/assets, and the diff once covered only the two
          # markdown files -- so a benchmark re-run that moved a figure but not
          # the prose passed this gate while the committed image silently
          # diverged from the data behind it. The pathspec is the whole
          # directory rather than a list of its subdirectories, for the same
          # reason: a list stops covering what is added after it.
          git diff --exit-code -- docs/results.md docs/glossary.md docs/assets
          # git diff does not see untracked files, and that mattered the moment
          # the generator started writing per-design assets: a re-run that
          # produced a new design would write an uncommitted .cif, the page
          # would offer it, this gate would stay green, and the published site
          # would 404 on the one structure nobody had committed.
          test -z "$(git status --porcelain --untracked-files=all -- docs/assets)"

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  gate:
    # One check for the branch ruleset on `main` to require.
    #
    # Naming the nine matrix jobs there instead would pin the ruleset to the
    # matrix: add a Python version or drop an OS and those contexts no longer
    # exist, so every merge would wait forever on a check that will never
    # report, and someone would have to edit the ruleset by hand to recover.
    # This job's name never changes.
    #
    # Which makes `needs` the entire guarantee, so it is held to the rest of
    # this file by tests/test_packaging_pins.py rather than by memory.
    name: All CI jobs passed
    runs-on: ubuntu-latest
    needs: [lint, test, pinned, build]
    # Without this the gate is skipped when anything it needs fails, and a
    # skipped required check never reports -- the merge would block on silence
    # rather than on the failure, which reads like an outage.
    if: always()
    steps:
      - name: Every job above must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          if printf '%s' "$RESULTS" | grep -qE '"result": *"(failure|cancelled|skipped)"'; then
            echo "::error::a job this gate depends on did not succeed"
            exit 1
          fi
