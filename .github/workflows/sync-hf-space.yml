name: Sync Hugging Face Space

# Push this repository's Space landing page to the Hugging Face Space and
# factory-rebuild it, so the mirror can never drift from `main` again.
#
# The Space's own requirements.txt installs
# `bindsight[discover,report] @ git+https://github.com/mikhaeelatefrizk/bindsight.git@main`,
# so a rebuild is what makes it serve current code; its README.md is a separate
# file in the Space repo and is what this workflow replaces.
#
# Dormant until an `HF_TOKEN` secret exists (Settings → Secrets and variables →
# Actions → New repository secret; the token needs *write* access to
# Mikhaeelatefrizk/bindsight). Without it every job skips rather than failing,
# so this never turns the checks red.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Factory-rebuild the Space after syncing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: false

env:
  SPACE_ID: Mikhaeelatefrizk/bindsight

jobs:
  sync:
    name: Push landing page + rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a token
        id: gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN is not set — skipping. The Space will keep serving whatever build it last made."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.has_token == 'true'
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        if: steps.gate.outputs.has_token == 'true'
        run: python -m pip install --quiet "huggingface_hub>=0.25,<1"

      - name: Upload the Space landing page
        if: steps.gate.outputs.has_token == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]
          api.upload_file(
              path_or_fileobj=".huggingface/README.md",
              path_in_repo="README.md",
              repo_id=space,
              repo_type="space",
              commit_message="Sync landing page from the bindsight repository",
          )
          print(f"uploaded README.md to {space}")
          PY

      - name: Factory-rebuild the Space
        if: steps.gate.outputs.has_token == 'true' && (github.event_name == 'release' || inputs.rebuild)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]
          # A plain restart reuses the cached image, which would keep serving the
          # bindsight revision the last build resolved. Only a factory reboot
          # re-runs pip and picks up current `main`.
          api.restart_space(space, factory_reboot=True)
          print(f"factory rebuild requested for {space}")
          PY
