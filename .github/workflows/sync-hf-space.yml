name: Sync Hugging Face Space

# Push this repository's Space assets to the Hugging Face Space and
# factory-rebuild it, so the mirror can never drift from `main` again.
#
# The Space's requirements.txt installs
# `bindsight[discover,report] @ git+https://github.com/mikhaeelatefrizk/bindsight.git@main`,
# so a rebuild is what makes it serve current code. Three things do NOT arrive
# that way, because they are not part of the installed package, and each is
# uploaded here instead:
#
#   README.md         the Space landing page
#   Dockerfile        the Space build, previously hand-maintained in the Space
#                     repo and invisible to review
#   requirements.txt  the build input, for the same reason: the Space's own
#                     copy still listed `streamlit>=1.36` after the release
#                     that removed Streamlit, and nothing here could see it
#
# There used to be a `.streamlit/config.toml` as well, and it is the reason this
# list exists: it sat at this repository's root, the Space never received it,
# and Streamlit read its config from the working directory — so for the Space's
# whole life the theme and the telemetry opt-out applied to local clones only,
# while the file's own comment named the Space as covered. The interface is
# server-rendered now and carries its styling inside the package, so there is no
# config file to drift. The Space repository also kept `src/streamlit_app.py`,
# the entry point that release deleted; nothing uploaded here overwrites a file
# that no longer exists here, so it is removed by name below.
#
# Dormant until an `HF_TOKEN` secret exists (Settings → Secrets and variables →
# Actions → New repository secret; the token needs *write* access to
# Mikhaeelatefrizk/bindsight).
#
# Without it the upload job is *skipped*, not passed. It used to run and report
# success with every meaningful step skipped inside it, so a reader looking at
# a release saw a green tick beside "Push Space assets + rebuild" for a push
# that never happened -- the silent success this repository exists to catch,
# committed by the workflow whose whole job is stopping the Space from drifting.
# Not failing is still right: a missing optional secret is not a broken build.
# Skipped says that; success said something false.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Factory-rebuild the Space after syncing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: false

env:
  SPACE_ID: Mikhaeelatefrizk/bindsight

jobs:
  # A job of its own, so the upload below can be skipped rather than run and
  # report success over a body of skipped steps. `secrets` is not readable from
  # a job-level `if`, so the answer has to travel as an output.
  gate:
    name: Is there a token?
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check for a token
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN is not set — the Space was NOT updated and keeps serving whatever build it last made."
            {
              echo "### The Space was not updated"
              echo
              echo "No \`HF_TOKEN\` secret, so nothing was uploaded and no rebuild was"
              echo "requested. The Space keeps serving whatever build it last made."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Push Space assets + rebuild
    needs: gate
    if: needs.gate.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: python -m pip install --quiet "huggingface_hub>=0.25,<1"

      - name: Upload the Space assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]

          uploads = [
              (".huggingface/Dockerfile", "Dockerfile"),
              (".huggingface/README.md", "README.md"),
              (".huggingface/requirements.txt", "requirements.txt"),
          ]
          for local, remote in uploads:
              api.upload_file(
                  path_or_fileobj=local,
                  path_in_repo=remote,
                  repo_id=space,
                  repo_type="space",
                  commit_message=f"Sync {remote} from the bindsight repository",
              )
              print(f"uploaded {remote} to {space}")

          # The Dockerfile above copies examples/ and benchmarks/ out of the
          # Space's build context, and nothing was sending them -- so the two
          # inputs the version-controlled build depends on stayed
          # hand-maintained in the Space repo, which is the drift this
          # workflow exists to stop, one level down. benchmarks/ is what the
          # Evidence page reads; without it that page renders nothing while
          # the README promises twenty binders.
          for folder in ("examples", "benchmarks"):
              api.upload_folder(
                  folder_path=folder,
                  path_in_repo=folder,
                  repo_id=space,
                  repo_type="space",
                  commit_message=f"Sync {folder}/ from the bindsight repository",
              )
              print(f"uploaded {folder}/ to {space}")

          # The Streamlit entry point the release removed. Guarded, because
          # delete_file raises once the path is gone, and this runs on every
          # release.
          stale = [
              path
              for path in ("src/streamlit_app.py",)
              if path in api.list_repo_files(space, repo_type="space")
          ]
          for path in stale:
              api.delete_file(
                  path_in_repo=path,
                  repo_id=space,
                  repo_type="space",
                  commit_message=f"Remove {path}: the Space no longer serves it",
              )
              print(f"deleted {path} from {space}")
          PY

      - name: Factory-rebuild the Space
        if: github.event_name == 'release' || inputs.rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE_ID"]
          # A plain restart reuses the cached image, which would keep serving the
          # bindsight revision the last build resolved. Only a factory reboot
          # re-runs pip and picks up current `main`.
          api.restart_space(space, factory_reboot=True)
          print(f"factory rebuild requested for {space}")
          PY
