name: Draft PDF (JOSS)

on:
  push:
    paths:
      - 'paper/paper.md'
      - 'paper/paper.bib'
      - '.github/workflows/draft-pdf.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Compile JOSS paper.md to PDF
    steps:
      - uses: actions/checkout@v7
      - name: Build draft PDF
        # Pinned to a commit, not to `@master`: whatever lands on that
        # branch would otherwise run here unreviewed, in the workflow that
        # builds the submitted paper. This SHA is what the `v1.0` tag points
        # at and what `master` pointed at when it was pinned, so it is a
        # no-op today. (The repository also carries a typo'd `v.1.0` tag
        # pointing somewhere older -- do not reach for it.)
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c  # v1.0
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
          if-no-files-found: error

  attach:
    name: Attach to the release
    needs: paper
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: paper
          path: paper
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # Renamed so the asset says which document it is next to the wheel,
        # the sdist and the bioRxiv manuscript's PDF.
        run: |
          cp paper/paper.pdf "bindsight-${TAG}-joss-paper.pdf"
          gh release upload "$TAG" "bindsight-${TAG}-joss-paper.pdf" --clobber --repo "${{ github.repository }}"
