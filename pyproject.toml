[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "bindsight"
version = "0.3.0"
description = "A reproducible bridge from RNA-seq to de novo protein binder design, with end-to-end provenance."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT"]
keywords = [
    "protein-design",
    "bioinformatics",
    "RNA-seq",
    "de-novo-binder-design",
    "AlphaFold",
    "RFdiffusion",
    "ProteinMPNN",
    "Boltz",
    "BindCraft",
    "reproducibility",
    "PROV-O",
    "RO-Crate",
    "target-discovery",
]
authors = [
    { name = "Mikhaeel Atef Rizk Wahba", email = "mikhaeelatefrizk@proton.me" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# -----------------------------------------------------------------------------
# Runtime dependencies — kept intentionally minimal for the package itself.
# Heavy stage-specific deps (pydeseq2, snakemake, biopython) live in conda envs
# under envs/*.yaml so users can install only what they need.
# -----------------------------------------------------------------------------
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.32",
    "rich>=13.7",          # CLI output formatting
    "tenacity>=8.4",       # API retry policies
    "platformdirs>=4.2",   # cache locations
    "jinja2>=3.1",         # Colab/Modal notebook templating
]

[project.optional-dependencies]
# Upper bounds on the scientific stack are deliberate: a new major — or, for
# 0.x pydeseq2, a new minor — can change the numbers a run reports, and a
# published result has to stay re-derivable. `envs/constraints.txt` pins the
# exact versions this release was resolved and tested against.
discover = [
    "pydeseq2>=0.5,<0.6",
    "pandas>=2.2,<3",
    "pyarrow>=16,<25",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",      # arrives via pydeseq2; its numerics move DEG results
    "biopython>=1.83,<2",
    "openpyxl>=3.1",       # parse the SURFY surfaceome .xlsx
]
report = [
    # The web interface: `bindsight ui` and `report --format web`. Server-rendered
    # Jinja over the same data layer the standalone report reads, which is why
    # jinja2 sits in the base dependencies rather than here.
    #
    # This replaced Streamlit and is a reduction: Streamlit declared 34
    # requirements, and every figure had to be expressed through a widget whose
    # layout the caller does not control -- which is how confidence intervals
    # ended up inside hover tooltips under a paragraph promising every rate
    # carried its interval. py3Dmol went with it: the 3-D viewer is 3Dmol.js
    # itself, vendored into the package, so nothing is fetched at render time.
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "matplotlib>=3.8,<4",  # renders the volcano plot embedded in every report
]
runners = [
    "modal>=0.64",
    "kaggle>=1.6",
]
workflow = [
    "snakemake>=8.0",  # optional Snakemake front-end (same pipeline as the CLI)
]
docs = [
    "mkdocs-material>=9.5,<10",  # MIT line; builds the docs site (mkdocs.yml)
]
embed = [
    # Protein-language-model embeddings (ESM-2) for the pre-GPU sequence-space
    # visualizer. Heavy + CPU-capable; kept out of `all` so the core stays lean.
    #
    # Bounded because these are not decoration: the ESM-2 prescreen decides
    # which designs reach validation, so a resolver crossing a major boundary
    # changes the design set. Both are named in
    # `provenance.manifest.SCIENTIFIC_STACK` and recorded in every manifest for
    # that reason, and both were declared with no ceiling — the pin test could
    # not see them because its scope was a hand-written list.
    "torch>=2.0,<3",
    # <6, not <5: the manifest of the committed join run records
    # transformers 5.12.0, so a lower ceiling would declare the recorded
    # environment non-compliant. The committed binder results did not exercise
    # the prescreen at all -- no artifact references it -- so for those numbers
    # this is environment context rather than a result input. It is bounded
    # anyway, because the moment the prescreen does run it decides which designs
    # reach validation.
    "transformers>=4.40,<6",
]
all = [
    "bindsight[discover,report,runners,workflow]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
    "types-pyyaml",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://mikhaeelatefrizk.github.io/bindsight/"
Documentation = "https://mikhaeelatefrizk.github.io/bindsight/"
Repository = "https://github.com/mikhaeelatefrizk/bindsight"
Issues = "https://github.com/mikhaeelatefrizk/bindsight/issues"
Changelog = "https://github.com/mikhaeelatefrizk/bindsight/blob/main/CHANGELOG.md"

[project.scripts]
bindsight = "bindsight.cli:main"
# Headless design+validation executor — entry point used by the Docker image and
# the local/native GPU runner (and importable as python -m bindsight.runners.job_exec).
bindsight-design = "bindsight.runners.job_exec:main"

# -----------------------------------------------------------------------------
# Plugin entry points — designers, validators, runners can be added by 3rd
# parties without forking bindsight.
# -----------------------------------------------------------------------------
[project.entry-points."bindsight.designers"]
rfdiff_mpnn = "bindsight.design.rfdiff_mpnn:RFdiffMPNNDesigner"
bindcraft   = "bindsight.design.bindcraft:BindCraftDesigner"
boltzgen    = "bindsight.design.boltzgen:BoltzGenDesigner"

[project.entry-points."bindsight.validators"]
boltz2  = "bindsight.validate.boltz2:Boltz2Validator"
chai1r  = "bindsight.validate.chai1r:Chai1rValidator"
af2_ig  = "bindsight.validate.af2_ig:AF2IGValidator"

[project.entry-points."bindsight.runners"]
colab        = "bindsight.runners.colab:ColabRunner"
modal        = "bindsight.runners.modal_runner:ModalRunner"
kaggle       = "bindsight.runners.kaggle:KaggleRunner"
local_docker = "bindsight.runners.local_docker:LocalDockerRunner"
mock         = "bindsight.runners.mock:MockRunner"

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["bindsight"]

# Include non-Python data files in the wheel: surfaceome offline list,
# report templates / CSS / JS, plus example data needed by `bindsight demo`.
[tool.hatch.build.targets.wheel.shared-data]
"examples/demo" = "bindsight_demo"

[tool.hatch.build.targets.wheel.force-include]
"bindsight/surfaceome/data/surfy_v1.uniprot.txt" = "bindsight/surfaceome/data/surfy_v1.uniprot.txt"
"bindsight/surfaceome/data/surfy_offline.txt" = "bindsight/surfaceome/data/surfy_offline.txt"
"bindsight/surfaceome/data/surfy_v1.ensembl.tsv" = "bindsight/surfaceome/data/surfy_v1.ensembl.tsv"
"bindsight/surfaceome/data/surfaceome_extended.tsv" = "bindsight/surfaceome/data/surfaceome_extended.tsv"
"bindsight/report/templates/report.html.j2"   = "bindsight/report/templates/report.html.j2"
"bindsight/report/templates/report.css"       = "bindsight/report/templates/report.css"
# The web interface's templates and static assets are deliberately NOT listed
# here: `packages = ["bindsight"]` above already collects every file under the
# package, and adding them again makes hatch refuse the build outright ("a
# second file is being added at the same path"). What guards them is
# tests/test_packaging_pins.py, which builds the wheel and opens it — a list in
# this file could only ever confirm itself, and these are not importable
# modules, so a missing one is a 404 for every pip-installed user while every
# test still passes.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".snakemake", "runs", "results"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PT",   # pytest-style
    "D",    # pydocstyle
]
ignore = [
    "D100", "D104", "D105", "D107",  # missing docstrings on modules / packages / dunder / __init__
    "E501",                            # line too long (formatter handles)
    "RUF001",                          # ambiguous Unicode in strings (× and similar are intentional)
    "RUF002",                          # ambiguous Unicode in docstrings (× and similar are intentional)
    "RUF003",                          # ambiguous Unicode in comments
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D", "S101"]
"bindsight/**/__init__.py" = ["D", "F401"]
"scripts/**/*" = ["D", "PLW0127"]    # Snakemake injects globals; doc-strings live in module docstring

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures", "build", "dist"]

[[tool.mypy.overrides]]
module = [
    "pydeseq2.*",
    "scipy.*",
    "Bio.*",
    "modal.*",
    "snakemake.*",
    "kaggle.*",
    "torch.*",
    "transformers.*",
    # pandas ships no inline types. The third-party pandas-stubs package was
    # evaluated and rejected: it removes 12 "no stubs" errors but introduces
    # ~16 overload conflicts against correct code (notably `.loc` indexing),
    # each of which would need a cast or an ignore that a stub update could
    # invalidate. Strict checking of bindsight's own code is the goal, and
    # this keeps it without that churn.
    "pandas.*",
]
ignore_missing_imports = true
# These third-party libs ship no type info; don't follow into them so calls
# aren't flagged as untyped in our (strict) code.
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=bindsight",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "gpu: tests that require an NVIDIA GPU (skipped in CI)",
    "slow: long-running tests against real APIs (skipped by default)",
    "integration: end-to-end tests across modules",
]

[tool.coverage.run]
branch = true
source = ["bindsight"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
