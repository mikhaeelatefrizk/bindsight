site_name: bindsight
site_description: bindsight is an open-source pipeline that turns RNA-seq counts into ranked de novo protein-binder candidates against over-expressed cell-surface antigens, with full PROV-O / RO-Crate provenance back to the patient cohort.
site_author: Mikhaeel Atef Rizk
site_url: https://mikhaeelatefrizk.github.io/bindsight/
repo_url: https://github.com/mikhaeelatefrizk/bindsight
repo_name: mikhaeelatefrizk/bindsight
copyright: "© 2026 Mikhaeel Atef Rizk Wahba — AGPL-3.0-or-later"
docs_dir: docs

# README.md is for GitHub, not for the site. A visitor clicking into docs/ on
# GitHub gets a map of what is in there and which two pages are generated;
# MkDocs, which treats every file under docs_dir as a page, sees it collide with
# index.md and -- under `mkdocs build --strict` -- makes that warning fatal.
# Excluding it keeps both audiences served by the file each one actually reads.
exclude_docs: |
  README.md

theme:
  name: material
  custom_dir: overrides
  # Brand assets and colours mirror bindsight/report/theme.py so the docs site,
  # the served interface (`bindsight ui`) and the generated HTML report read
  # as one product.
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

# Only the small viewer bootstrap is loaded site-wide; it returns immediately
# on any page with no [data-binder-viewer] host. The 537 kB 3Dmol library is
# deliberately NOT listed here -- the script injects it on demand, so eight
# pages do not pay for the one that draws structures.
extra_javascript:
  - assets/js/binder_viewer.js
  - assets/js/your_data_check.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mikhaeelatefrizk/bindsight
      name: bindsight on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mikhaeel-atef-rizk-6549b8378
      name: Mikhaeel Atef Rizk on LinkedIn

nav:
  - Home: index.md
  - Real results: results.md
  - What is bindsight?: what-is-bindsight.md
  - Glossary: glossary.md
  - How to use: how-to-use.md
  - Try your data: try-your-data.md
  - Use cases: use-cases.md
  - Designing on Colab: colab-design-howto.md
  - Positioning: positioning.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true

plugins:
  - search
